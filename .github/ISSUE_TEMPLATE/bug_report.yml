name: Bug report
description: Something is broken or behaves unexpectedly
title: "fix: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - API
        - Background jobs / worker
        - Invoices / quotes / PDFs
        - Auth / workspaces / roles
        - Billing / subscriptions
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, Sentry link
      description: Do not paste secrets or customer personal data.
      render: shell
