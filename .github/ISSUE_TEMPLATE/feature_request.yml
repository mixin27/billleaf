name: Feature request
description: Suggest a new capability or improvement
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom (freelancer, agency, client)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: plan
    attributes:
      label: Plan tier
      description: Which plan should this belong to?
      options:
        - Free
        - Pro
        - Team / Agency
        - Not sure
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues.
