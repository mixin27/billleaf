name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billleaf
          POSTGRES_PASSWORD: billleaf
          POSTGRES_DB: billleaf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billleaf -d billleaf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://billleaf:billleaf@localhost:5432/billleaf_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      # Version is read from the root package.json "packageManager" field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build --cache-dir=.turbo/cache

      # S3-compatible storage for file/logo tests. Job `services` can't pass a
      # container command, so SeaweedFS is started here instead.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done
          echo "SeaweedFS did not start"; docker logs s3; exit 1

      # Real Postgres + Valkey (job services above) + SeaweedFS. Recreates billleaf_test each run.
      - name: Integration tests
        run: pnpm turbo test:integration --cache-dir=.turbo/cache

      # The production stack must resolve with the documented variables, and
      # the smoke script must be valid shell.
      - name: Validate production compose and smoke script
        run: |
          docker compose -f infra/docker-compose.prod.yml \
            --env-file infra/.env.production.example config --quiet
          bash -n infra/smoke.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billleaf
          POSTGRES_PASSWORD: billleaf
          POSTGRES_DB: billleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billleaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Catches the emails the journeys read (verification, quotes, invites).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done
          echo "SeaweedFS did not start"; docker logs s3; exit 1

      # Builds the API (and packages), then Playwright builds the web app
      # into .next-e2e and starts web :3100 + api/worker :4100 itself.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
