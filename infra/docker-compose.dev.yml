# Local development dependencies (postgres, valkey, s3, mailpit). Apps run on the host via `pnpm dev`.
#   pnpm infra:up   /   pnpm infra:down
name: billleaf-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billleaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billleaf}
      POSTGRES_DB: ${POSTGRES_DB:-billleaf}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible storage at http://localhost:8333 (production uses Cloudflare R2).
  # SeaweedFS replaces MinIO, whose images are no longer published on Docker Hub.
  # No auth locally: any access key/secret works.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    restart: unless-stopped
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  # Catches all outgoing email — UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  valkeydata:
  s3data:
