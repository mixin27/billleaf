# Production stack for a single VPS, deployed as a Dokploy "Compose" app from
# this Git repo (compose path: infra/docker-compose.prod.yml). Runbook:
# docs/infrastructure/dokploy-runbook.md.
#
# - Images come from GHCR, built by .github/workflows/deploy.yml.
#   IMAGE_TAG picks the release: "production" / "staging" (moving, set by CI)
#   or "production-sha-<7>" to pin/roll back. There is no "latest".
# - Every variable is listed in infra/.env.production.example; set them in
#   Dokploy → Environment (never commit real values).
# - Domains: add them in Dokploy → Domains (web → port 3000, api → port 4000);
#   Dokploy adds the Traefik labels and TLS certificates.
# Staging on the same VPS sets STACK_NAME=staging (separate containers + volumes).
# Memory limits are sized to share an 8 GB server with another app (about
# 2.4 GB for this stack); raise them on a server of its own.
name: billleaf-${STACK_NAME:-production}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://valkey:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
  API_URL: ${API_URL:?}
  WEB_URL: ${WEB_URL:?}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:?}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  SMTP_URL: ${SMTP_URL:?}
  EMAIL_FROM: ${EMAIL_FROM:?}
  # Cloudflare R2 (S3-compatible). The bucket is private; the API presigns reads.
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_FORCE_PATH_STYLE: "false"
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-test}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?}
  HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
  # Push notifications (ADR-0018): "log" until the mobile app points here.
  PUSH_PROVIDER: ${PUSH_PROVIDER:-log}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

x-api-image: &api-image ghcr.io/${GHCR_OWNER:?}/billleaf-api:${IMAGE_TAG:?set IMAGE_TAG, e.g. production}

services:
  # One-off per deploy: Drizzle migrations + permission catalog sync.
  # api/worker only start once it exits successfully.
  migrate:
    image: *api-image
    pull_policy: always
    command: ["node", "dist/migrate.js"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    healthcheck: { disable: true }
    logging: *logging

  api:
    image: *api-image
    pull_policy: always
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
    # CJK PDF fonts, fetched on first use (see apps/api cjk-fonts.ts).
    volumes: [pdffonts:/app/.font-cache]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  worker:
    image: *api-image
    pull_policy: always
    command: ["node", "--import", "./dist/instrument.js", "dist/worker.js"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    restart: unless-stopped
    volumes: [pdffonts:/app/.font-cache]
    # Let in-flight jobs (emails, PDFs) finish on deploys.
    stop_grace_period: 60s
    # No HTTP here: the worker touches this file every 30 s.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER:?}/billleaf-web:${IMAGE_TAG:?set IMAGE_TAG, e.g. production}
    pull_policy: always
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 384M }
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    # BullMQ needs noeviction: never drop queued jobs under memory pressure.
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "200mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: [valkeydata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *logging

  # Nightly pg_dump to R2 with retention (infra/backup/backup.sh).
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:?}
      AWS_DEFAULT_REGION: auto
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes: [./backup:/backup:ro]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 256M }
    logging: *logging

volumes:
  pgdata:
  valkeydata:
  pdffonts:
